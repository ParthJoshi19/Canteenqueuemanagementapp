version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: canteen-postgres
    restart: always
    environment:
      POSTGRES_DB: canteen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: canteen-redis-pubsub
    restart: always
    ports:
      - "6379:6379"

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
    container_name: order-service-node
    environment:
      PORT: 3001
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgrespassword}@postgres:5432/canteen
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  queue-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
    container_name: queue-service-node
    environment:
      PORT: 3002
      SERVICE_NAME: queue-service
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      - redis

  kitchen-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
    container_name: kitchen-service-node
    environment:
      PORT: 3003
      SERVICE_NAME: kitchen-service
      REDIS_URL: redis://redis:6379
    ports:
      - "3003:3003"
    depends_on:
      - redis

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
    container_name: notification-serverless-worker
    environment:
      PORT: 3004
      SERVICE_NAME: notification-service
      REDIS_URL: redis://redis:6379
    ports:
      - "3004:3004"
    depends_on:
      - redis

  backend:
    image: ${BACKEND_IMAGE:-canteen-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: canteen-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgrespassword}@postgres:5432/canteen
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: canteen
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-strong-random-secret}
      TRACE_EXPORT_URL: http://alloy:9411/api/v2/spans
      OTEL_SERVICE_NAME: canteen-backend
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres

  frontend:
    image: ${FRONTEND_IMAGE:-canteen-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: canteen-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend 

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.5.0
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki

  tempo:
    image: grafana/tempo:2.7.2
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo

  alloy:
    image: grafana/alloy:v1.10.2
    profiles: [observability]
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo

volumes:
  pgdata:
  prometheusdata:
  grafanadata:
  lokidata:
  tempodata:
  alloydata:
