name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "BACKEND_IMAGE=$REPO-backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=$REPO-frontend:${{ github.sha }}" >> $GITHUB_ENV
          docker build -t "$REPO-backend:${{ github.sha }}" -f backend/Dockerfile .
          docker build -t "$REPO-frontend:${{ github.sha }}" -f frontend/Dockerfile .
          docker push "$REPO-backend:${{ github.sha }}"
          docker push "$REPO-frontend:${{ github.sha }}"

      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        timeout-minutes: 15
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 30s
          command_timeout: 20m
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,DB_PASSWORD,JWT_SECRET,GRAFANA_ADMIN_PASSWORD,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git status --short
            timeout 120 git pull --ff-only origin main
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin
            docker compose config -q
            docker compose pull backend frontend
            docker compose up -d backend frontend
            docker compose ps
            docker image prune -f