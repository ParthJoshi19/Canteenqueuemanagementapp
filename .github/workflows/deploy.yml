name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags
        id: images
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${repo}-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repo}-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend }}

  deploy:
    needs: build-and-push
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN,DB_PASSWORD,JWT_SECRET,GRAFANA_ADMIN_PASSWORD
          script: |
            set -eu
            cd "$DEPLOY_PATH"

            # Sync code repository
            git fetch origin main
            git reset --hard origin/main

            # Docker login & pull images
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export BACKEND_IMAGE FRONTEND_IMAGE DB_PASSWORD JWT_SECRET GRAFANA_ADMIN_PASSWORD
            docker compose pull backend frontend

            # Start database and run migrations
            docker compose up -d postgres
            sleep 5
            docker compose run --rm backend npm run migrate

            # Start services and observability
            docker compose up -d --no-build --no-deps backend frontend
            docker compose --profile observability up -d prometheus grafana loki tempo alloy
