name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to EC2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") \
             DB_PASSWORD=$(printf '%q' "$DB_PASSWORD") \
             JWT_SECRET=$(printf '%q' "$JWT_SECRET") \
             GRAFANA_ADMIN_PASSWORD=$(printf '%q' "$GRAFANA_ADMIN_PASSWORD") \
             bash -s" << 'EOF'
            set -eu

            echo "STEP 1: SSH connected"
            cd "$DEPLOY_PATH"
            echo "STEP 2: Deployment directory: $(pwd)"

            echo "STEP 3: Checking Git status"
            git status --short

            echo "STEP 4: Pulling latest code"
            timeout 120 git pull --ff-only origin main
            echo "STEP 5: Git pull completed"

            echo "STEP 6: Checking Docker Compose"
            docker compose config -q
            echo "STEP 7: Compose configuration valid"

            echo "STEP 8: Building and starting containers"
            export DB_PASSWORD JWT_SECRET GRAFANA_ADMIN_PASSWORD
            docker compose up -d --build backend frontend
            echo "STEP 9: Containers started"

            echo "DEPLOYMENT COMPLETED"
          EOF
