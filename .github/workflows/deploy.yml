
name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 30s
          command_timeout: 25m
          envs: DB_PASSWORD,JWT_SECRET,GRAFANA_ADMIN_PASSWORD

          script: |
            set -eu

            echo "STEP 1: SSH connected"

            cd "${{ secrets.DEPLOY_PATH }}"
            echo "STEP 2: Deployment directory: $(pwd)"

            echo "STEP 3: Checking Git configuration"
            git remote -v
            git status --short

            echo "STEP 4: Fetching latest code"
            export GIT_TERMINAL_PROMPT=0
            git fetch --progress origin main

            echo "STEP 5: Synchronizing main branch"
            git checkout main
            git reset --hard origin/main

            echo "STEP 6: Validating Docker Compose"
            docker compose config -q

            echo "STEP 7: Building and starting containers"
            docker compose up -d --build backend frontend

            echo "STEP 8: Checking container status"
            docker compose ps

            echo "STEP 9: Deployment completed"
