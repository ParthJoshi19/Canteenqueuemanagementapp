name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        timeout-minutes: 15
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          envs: DB_PASSWORD,JWT_SECRET,GRAFANA_ADMIN_PASSWORD
          script: |
            set -eu

            echo "STEP 1: SSH connected"
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "STEP 2: Deployment directory: $(pwd)"

            echo "STEP 3: Checking Git status"
            git status --short

            echo "STEP 4: Pulling latest code"
            timeout 120 git pull --ff-only origin main
            echo "STEP 5: Git pull completed"

            echo "STEP 6: Checking Docker Compose"
            docker compose config -q
            echo "STEP 7: Compose configuration valid"

            echo "STEP 8: Building and starting containers"
            docker compose up -d --build backend frontend
            echo "STEP 9: Containers started"

            echo "STEP 10: Pruning unused images"
            docker image prune -f

            echo "DEPLOYMENT COMPLETED"
